<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Twin</title><style>
 :root{--a1:#5aa2ff;--a2:#b06bff;--bg:#0a0e14;--pan:#111926;--mine:#2a4a7f;--his:#1a2432}
 *{margin:0;box-sizing:border-box;font-family:Segoe UI,Inter,Arial,sans-serif}
 body{background:var(--bg);height:100vh;display:flex;flex-direction:column;color:#eaf1f8}
 header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--pan);border-bottom:1px solid #1e2a3a;box-shadow:0 2px 20px rgba(0,0,0,.4)}
 .av{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid transparent;background:linear-gradient(135deg,var(--a1),var(--a2));padding:2px}
 header .nm{font-weight:700;font-size:19px}header .st{font-size:13px;color:#36d39a;display:flex;align-items:center;gap:6px}
 .dotg{width:8px;height:8px;border-radius:50%;background:#36d39a;box-shadow:0 0 8px #36d39a}
 #chat{flex:1;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:12px}
 .row{display:flex;gap:10px;max-width:min(760px,92%)}
 .row.me{align-self:flex-end;flex-direction:row-reverse}
 .bub{padding:12px 16px;border-radius:18px;font-size:16px;line-height:1.5;white-space:pre-wrap}
 .his .bub{background:var(--his);border-bottom-left-radius:6px}
 .me .bub{background:var(--mine);border-bottom-right-radius:6px}
 .mini{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--a1),var(--a2));padding:2px}
 .typing .bub{color:#7f93a8}.typing .d{display:inline-block;animation:bl 1.2s infinite}.typing .d:nth-child(2){animation-delay:.2s}.typing .d:nth-child(3){animation-delay:.4s}
 @keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:1}}
 footer{padding:14px 16px;background:var(--pan);border-top:1px solid #1e2a3a;display:flex;gap:10px}
 #inp{flex:1;background:#0c131d;border:1px solid #243244;border-radius:24px;padding:14px 18px;color:#eaf1f8;font-size:16px;outline:none}
 #inp:focus{border-color:var(--a1)}
 #snd{background:linear-gradient(135deg,var(--a1),var(--a2));border:none;color:#fff;border-radius:50%;width:50px;height:50px;font-size:22px;cursor:pointer}
 #snd:disabled{opacity:.5}
</style></head><body>
<header>
 <img class="av" src="/avatar" alt="Principal"/>
 <div><div class="nm">Digital Twin</div><div class="st"><span class="dotg"></span>online · your support twin</div></div>
</header>
<div id="chat"></div>
<footer>
 <input id="inp" placeholder="Message Digital Twin..." autofocus/>
 <button id="snd">➤</button>
</footer>
<script>
const chat=document.getElementById('chat'),inp=document.getElementById('inp'),snd=document.getElementById('snd');
function add(txt,who){const r=document.createElement('div');r.className='row '+who;
  r.innerHTML=(who=='his'?'<img class="mini" src="/avatar">':'')+'<div class="bub"></div>';
  r.querySelector('.bub').textContent=txt;chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return r;}
function typing(){const r=document.createElement('div');r.className='row his typing';
  r.innerHTML='<img class="mini" src="/avatar"><div class="bub"><span class="d">●</span><span class="d">●</span><span class="d">●</span></div>';
  chat.appendChild(r);chat.scrollTop=chat.scrollHeight;return r;}
async function send(){const m=inp.value.trim();if(!m)return;inp.value='';add(m,'me');snd.disabled=true;
  const t=typing();
  try{const res=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
      const j=await res.json();t.remove();add(j.reply||'(no reply)','his');}
  catch(e){t.remove();add('(connection error)','his');}
  snd.disabled=false;inp.focus();}
snd.onclick=send;inp.onkeydown=e=>{if(e.key=='Enter')send();};
add("Hi, I'm Digital Twin — your support twin. Ask me anything about a ticket or an Odoo issue.",'his');
</script></body></html>
