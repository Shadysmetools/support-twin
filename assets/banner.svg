<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="support-twin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="880" height="220" rx="18" fill="url(#bg)"/>
  <!-- two overlapping heads: the human and the twin -->
  <g transform="translate(70,48)">
    <circle cx="52" cy="40" r="30" fill="none" stroke="#e2e8f0" stroke-width="6"/>
    <path d="M8 124c6-30 26-46 44-46s38 16 44 46" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="102" cy="40" r="30" fill="none" stroke="url(#acc)" stroke-width="6" stroke-dasharray="10 7"/>
    <path d="M58 124c6-30 26-46 44-46s38 16 44 46" fill="none" stroke="url(#acc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 7"/>
  </g>
  <text x="270" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#f8fafc">support-twin</text>
  <text x="272" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#cbd5e1">An AI twin of your support agent. It drafts, proves, waits for a human tap.</text>
  <rect x="272" y="166" width="300" height="5" rx="2.5" fill="url(#acc)"/>
</svg>
